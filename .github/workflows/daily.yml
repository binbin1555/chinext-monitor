name: 创业板每日监测

# 仅通过 workflow_dispatch 触发（由 cron-job.org 定时调用 GitHub API）
# cron-job.org 配置方法详见 README.md
on:
  workflow_dispatch:
    inputs:
      no_push:
        description: "跳过 Bark 推送（true/false）"
        default: "false"
        required: false

permissions:
  contents: write       # 允许 commit 回仓库
  pages: write          # 允许通过 Actions 部署 GitHub Pages
  id-token: write       # deploy-pages 鉴权要求

# 串行化：多次触发（含 cron-job.org 与手动并发）排队执行，避免并发 push 冲突
concurrency:
  group: chinext-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整历史，避免 force-push

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # 强制升级节假日包：国务院每年11月发布次年放假安排，包随即更新；
          # pip cache 以 requirements.txt 哈希为 key，不会自动拿到新版，需手动升级。
          pip install --upgrade chinesecalendar

      - name: Run monitor
        env:
          LIXINGER_TOKEN: ${{ secrets.LIXINGER_TOKEN }}
          QIEMAN_KEY:     ${{ secrets.QIEMAN_KEY }}
          BARK_KEY:       ${{ secrets.BARK_KEY }}
          DASHBOARD_URL:  ${{ secrets.DASHBOARD_URL }}
        run: |
          NO_PUSH="${{ github.event.inputs.no_push }}"
          if [ "$NO_PUSH" = "true" ]; then
            python src/main.py --no-push
          else
            python src/main.py --defer-push
          fi

      # 中证红利 分批监测（独立模块，买 -4/-7/-10 + 涨回MA250 止盈）。
      # 理杏仁 cp 为主 + 腾讯备援交叉校验；仅在触发买/卖档位时直接 Bark 推送，平时静默。
      - name: Run dividend monitor (中证红利)
        if: always()          # 独立于创业板监测：即便上面失败也照常判断红利
        env:
          LIXINGER_TOKEN: ${{ secrets.LIXINGER_TOKEN }}
          BARK_KEY:       ${{ secrets.BARK_KEY }}
          DASHBOARD_URL:  ${{ secrets.DASHBOARD_URL }}
        run: |
          NO_PUSH="${{ github.event.inputs.no_push }}"
          if [ "$NO_PUSH" = "true" ]; then
            python src/dividend.py --no-push
          else
            python src/dividend.py
          fi

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.csv state.json docs/data.json ledger.csv data/dividend_history.csv docs/dividend.json
          # 仅在有变更时提交
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"; exit 0
          fi
          git commit -m "chore: 自动更新监测数据 $(date -u '+%Y-%m-%d %H:%M UTC')"
          # 推送：与用户回填 ledger 等并发提交冲突时，rebase 后重试，避免数据丢失
          for i in 1 2 3 4 5; do
            if git push; then echo "push 成功"; exit 0; fi
            echo "push 被拒（第 $i 次），rebase 后重试…"
            git pull --rebase --autostash origin main || { echo "rebase 失败"; exit 1; }
          done
          echo "push 多次失败"; exit 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send pending Bark notifications
        if: always() && github.event.inputs.no_push != 'true'
        env:
          BARK_KEY:      ${{ secrets.BARK_KEY }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: python src/main.py --send-pending
